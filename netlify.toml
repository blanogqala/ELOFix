# Netlify: Site settings > Build & deploy > use repo root; this file sets base = "frontend".
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Omit node_modules (Firebase's documented example AIza… key). Keep smart detection on.
  # Narrow false-positive omit: Firebase docs sample key, not a real secret.
  SECRETS_SCAN_OMIT_PATHS = "node_modules"
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyDOCAbC123dEf456GhI789jKl012-MnO"
  # Production CSP/API URLs must be supplied as Netlify env: VITE_API_BASE_URL, VITE_API_ORIGIN.
  # Do not rely on the generate-security-headers localhost fallback.

# SPA fallback for react-router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers (CSP, HSTS, etc.) are generated at build time into frontend/public/_headers
# by frontend/scripts/generate-security-headers.mjs (runs before vite build).
