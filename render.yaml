# Render Blueprint: New > Blueprint > paste this repo URL, or connect GitHub and apply this file.
# After deploy, set JWT_SECRET (and optional ADMIN_* if you run seed) in the service Environment tab.

databases:
  - name: elofix-db
    databaseName: elofix
    user: elofix
    plan: free

services:
  - type: web
    name: elofix-api
    runtime: node
    region: oregon
    plan: free
    rootDir: elofix-backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: elofix-db
          property: connectionString
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        sync: false
