# Render Blueprint: New > Blueprint > paste this repo URL, or connect GitHub and apply this file.
# After deploy, set JWT_SECRET and Google OAuth vars in the service Environment tab (see envVars with sync: false).

databases:
  - name: elofix-db
    databaseName: elofix
    user: elofix
    plan: free

services:
  - type: web
    name: elofix-api
    runtime: node
    region: oregon
    plan: free
    rootDir: elofix-backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    # Uploaded files need persistent storage. Staging may use a Render Disk (Starter+):
    # mount /opt/render/project/src/uploads, set UPLOAD_ROOT to that path, and set
    # ELOFIX_ALLOW_LOCAL_UPLOADS=true so /ready does not require S3.
    # Do not use the ephemeral Free-tier filesystem. See elofix-backend/docs/IMAGE_STORAGE_DEPLOY.md
    envVars:
      - key: UPLOAD_ROOT
        sync: false
      - key: ELOFIX_ALLOW_LOCAL_UPLOADS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: auto
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: elofix-db
          property: connectionString
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PAYMENT_CURRENCY
        value: ZAR
      - key: PAYMENT_BASE_URL
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: ENABLED_PAYMENT_PROVIDERS
        value: payfast
      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: PAYFAST_MERCHANT_KEY
        sync: false
      - key: PAYFAST_PASSPHRASE
        sync: false
      - key: PAYFAST_MODE
        value: sandbox
      # Do not set PAYFAST_SKIP_IP_CHECK or PAYFAST_SETTLE_ON_RETURN here.
      # NODE_ENV=production rejects those flags at API startup. Hosted sandbox
      # must use PayFast ITN webhooks and IP verification.
