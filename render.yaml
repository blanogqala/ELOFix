# Render Blueprint: New > Blueprint > paste this repo URL, or connect GitHub and apply this file.
# After deploy, set JWT_SECRET and Google OAuth vars in the service Environment tab (see envVars with sync: false).

databases:
  - name: elofix-db
    databaseName: elofix
    user: elofix
    plan: free

services:
  - type: web
    name: elofix-api
    runtime: node
    region: oregon
    plan: free
    rootDir: elofix-backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    # Uploaded files need a persistent disk on Render (Starter+). In Dashboard: Disks → mount path
    # /opt/render/project/src/uploads, then set UPLOAD_ROOT to the same path. See elofix-backend/docs/IMAGE_STORAGE_DEPLOY.md
    envVars:
      - key: UPLOAD_ROOT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: auto
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: elofix-db
          property: connectionString
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PAYMENT_CURRENCY
        value: ZAR
      - key: PAYMENT_BASE_URL
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: ENABLED_PAYMENT_PROVIDERS
        value: payfast
      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: PAYFAST_MERCHANT_KEY
        sync: false
      - key: PAYFAST_PASSPHRASE
        sync: false
      - key: PAYFAST_MODE
        value: sandbox
      - key: PAYFAST_SKIP_IP_CHECK
        value: "true"
      - key: PAYFAST_SETTLE_ON_RETURN
        value: "true"
