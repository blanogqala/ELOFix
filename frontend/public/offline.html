<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EloFix is offline</title>
    <meta name="theme-color" content="#0A2540" />
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0a2540;
        color: #102033;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      main {
        width: min(100%, 28rem);
        background: #fff;
        border-radius: 16px;
        padding: 28px 22px;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 1.35rem;
      }
      p {
        margin: 0;
        line-height: 1.5;
        color: #3d4d5c;
      }
      a {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 18px;
        border-radius: 10px;
        background: #ff9f1c;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icon-192.png" alt="" width="72" height="72" />
      <h1>You are offline</h1>
      <p>
        EloFix needs a connection to open your account, jobs, and payments. This screen does not keep a copy of that
        information.
      </p>
      <a href="">Try again</a>
    </main>
  </body>
</html>
